name: Build Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Android NDK Manually
      run: |
        echo "NDK indiriliyor..."
        wget -q https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
        echo "Arşiv açılıyor..."
        unzip -q android-ndk-r23b-linux.zip
        echo "ANDROID_NDK_HOME ayarlanıyor..."
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r23b" >> $GITHUB_ENV
        echo "$PWD/android-ndk-r23b" >> $GITHUB_PATH

    - name: Build Library
      run: |
        cd jni
        ndk-build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ModMenu-Output
        path: |
          libs/
          bin/
